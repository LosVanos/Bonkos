name: Android (APK e AAB)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
      BONKOS_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        continue-on-error: true
      - name: Confirmar o Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: npm ci
      - run: node build-www.js
      - run: npx cap sync android

      - name: APK de teste (instala no telemóvel)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"
          exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        with:
          name: bonkos-apk-teste
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Guardar a APK no ramo "apk" (para descarregar facilmente)
        run: |
          mkdir -p "$RUNNER_TEMP/apkbr" && cd "$RUNNER_TEMP/apkbr"
          git init -q && git checkout -q -b apk
          cp "$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk" Bonkos.apk
          echo "Compilação ${{ github.run_number }} de ${{ github.sha }}" > LEIA-ME.txt
          git add Bonkos.apk LEIA-ME.txt
          git -c user.name="bonkos-bot" -c user.email="bonkos-bot@users.noreply.github.com" commit -qm "APK ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk

      - name: Preparar chave de assinatura
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/bonkos.jks
      - name: AAB assinado (para a Play Store)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          BONKOS_KEYSTORE: ${{ runner.temp }}/bonkos.jks
          BONKOS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BONKOS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          BONKOS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: bonkos-aab-playstore
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Guardar o registo do erro (ramo "log")
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/logbr" && cd "$RUNNER_TEMP/logbr"
          git init -q && git checkout -q -b log
          if [ -f "$RUNNER_TEMP/build.log" ]; then grep -n -B3 -A25 -E "FAILURE|What went wrong|error:|ERROR|Exception" "$RUNNER_TEMP/build.log" | head -c 150000 > erros.txt; tail -c 150000 "$RUNNER_TEMP/build.log" > build.log; else echo "sem registo" > build.log; fi
          git add -A
          git -c user.name="bonkos-bot" -c user.email="bonkos-bot@users.noreply.github.com" commit -qm "registo ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" log
